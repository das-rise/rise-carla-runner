[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rirun"
version = "0.2.0"
description = "A Carla runner for creating parametrizable scenarios from real-world automotive scenes"
readme = "readme.md"
requires-python = ">=3.8,<3.9"
license = { text = "GPL-3.0 AND MIT AND APACHE-2.0" }

authors = [
  { name = "Bastian Havers-Zulka", email = "bastian.havers-zulka@ri.se" }
]

dependencies = [
  "numpy==1.23.0",
  "pandas==2.0.3",
  "scipy==1.10.1",
  "scikit-learn==1.3.2",
  "torch==2.2.0",
  "torchvision==0.17.0",
  "torchaudio==2.2.0",
  "lightning==2.3.3",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "opencv-python==4.2.0.32",
  "pillow==10.2.0",
  "transformers==4.46.3",
  "timm==0.9.16",
  "rich_argparse==1.7.2",
  "carla==0.9.15",
  "py_trees==2.2.3",
  "pygame==2.6.1",
  "shapely==2.0.7",
  "ujson==5.10.0",
  "laspy==2.5.4",
  "imgaug==0.4.0",
  "filterpy==1.4.5",
  "rdp==0.8",
  "dataprov>=3.2",
  "xodr-plot @ file:helpers/xodr_plot",
  "traj_convert @ git+https://github.com/das-rise/osi-gen",
  # --- PCLA (vendored upstream, see src/rirun/PCLA/README.md) ---
  # Core PCLA runtime
  "h5py==3.10.0",
  "diskcache==5.6.3",
  "jsonpickle==4.1.1",
  "lxml==5.3.0",
  "pytictoc==1.5.3",
  "tabulate==0.9.0",
  "webcolors==1.13",
  "tensorboardX==2.6.2.2",
  "easydict==1.13",
  "addict==2.4.0",
  "retry==0.9.2",
  "prettytable==3.11.0",  # 3.11.0 is the newest release supporting Python 3.8
  "pyquaternion==0.9.9",
  "similaritymeasures==1.4.0",
  "terminaltables==3.1.10",
  "trimesh==4.12.2",
  "descartes==1.1.0",
  "numba==0.58.1",
  "requests>=2.28",
  "tqdm>=4.65",
  # 0.25.x is required: diffusers 0.16.0 (MindDrive/ORION) imports
  # `cached_download`, removed from huggingface-hub in 0.26.
  "huggingface-hub==0.25.2",
  "wandb==0.21.4",
  # Transfuser v6 (Lead) / PlanT / PlanT2 typing
  "jaxtyping==0.2.19",  # 0.2.19 is the newest release supporting Python 3.8
  "beartype==0.19.0",
  # ThinkTwice (tt)
  "mmcv-lite==2.1.0",
  "mmdet==3.3.0",
  "mmengine==0.10.3",
  "spconv-cu120==2.3.6",
  # MindDrive / ORION
  "diffusers==0.16.0",
  # LMDrive (LAVIS)
  "ftfy==6.1.1",
  "iopath==0.1.10",
  "decord==0.6.0",
  "fairscale==0.4.4",
  "webdataset==0.2.100",
  "spacy==3.7.5",
  "pycocoevalcap==1.2",
  "python-magic",
  "modelindex",
  "opendatasets==0.1.22",
  "plotly",
  # CaRL / Roach / PlanT (RL)
  "gymnasium==0.29.1",  # 0.29.x is the newest release supporting Python 3.8
  "pyzmq>=26",
  # World on Rails (wor)
  "lmdb==1.7.3",
]

[project.optional-dependencies]
train = [
  "accelerate==1.0.1",
  "deepspeed==0.16.2",
  "peft==0.13.2",
  "onnx==1.15.0",
]

dev = [
  "ruff==0.13.2",
  "pre-commit>=3.5",
  "ipykernel==6.29.5",
  "ipympl",
  "line-profiler==4.1.2",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
